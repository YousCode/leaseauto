    <!-- =====================
         Devtools / Console logs cleanup
         (Tempo / CSS warnings)
    ====================== -->
    <script>
      (function suppressDevtoolsLogs() {
        const suppressedPatterns = [
          'extractCssCustomProperties',
          'cssRules',
          'SecurityError',
          'Cannot access rules',
          'tempo.build/devtools',
          'CSSStyleSheet',
          'MessagePort.i',
          'Failed to read the \'cssRules\' property'
        ];

        const shouldSuppress = (message) =>
          suppressedPatterns.some(pattern =>
            String(message).includes(pattern)
          );

        ['error', 'warn', 'log'].forEach(method => {
          const original = console[method];
          console[method] = function (...args) {
            if (!args.some(arg => shouldSuppress(arg))) {
              original.apply(console, args);
            }
          };
        });

        window.addEventListener('error', (event) => {
          if (shouldSuppress(event.message)) {
            event.preventDefault();
            event.stopPropagation();
          }
        });
      })();
    </script>
